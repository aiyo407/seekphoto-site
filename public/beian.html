<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网站备案中 - 觅影随笔</title>
  <meta name="description" content="本站正在进行 ICP 备案审核，稍后将恢复正常访问。" />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #FAFAF9 100%);
      color: #1C1917;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 560px;
      width: 100%;
      text-align: center;
      background: #FFFFFF;
      border: 1px solid #E7E5E4;
      border-radius: 12px;
      padding: 64px 40px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #5B53E8 0%, #8B5CF6 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .logo svg {
      width: 32px;
      height: 32px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
      color: #1C1917;
    }

    .subtitle {
      font-size: 15px;
      color: #78716C;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #EEEAFF;
      color: #5B53E8;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 32px;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #5B53E8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .info-list {
      text-align: left;
      background: #F5F5F4;
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 32px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 13px;
      color: #78716C;
      line-height: 1.7;
      padding: 6px 0;
    }

    .info-item strong {
      color: #1C1917;
      font-weight: 500;
      min-width: 72px;
      flex-shrink: 0;
    }

    .contact {
      font-size: 13px;
      color: #A8A29E;
      line-height: 1.8;
    }

    .contact a {
      color: #5B53E8;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .contact a:hover {
      color: #483FD6;
    }

    .footer-text {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #E7E5E4;
      font-size: 12px;
      color: #A8A29E;
    }

    @media (max-width: 480px) {
      .container {
        padding: 48px 24px;
      }

      h1 {
        font-size: 20px;
      }

      .info-item {
        flex-direction: column;
        gap: 4px;
      }

      .info-item strong {
        min-width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>

    <h1>网站备案中</h1>
    <p class="subtitle">
      本站正在进行 ICP 备案审核<br>
      期间网站内容暂不可访问，敬请谅解
    </p>

    <div class="status">
      <span class="spinner"></span>
      审核进行中
    </div>

    <div class="info-list">
      <div class="info-item">
        <strong>网站名称</strong>
        <span>觅影随笔</span>
      </div>
      <div class="info-item">
        <strong>网站类型</strong>
        <span>个人博客 / 个人作品展示</span>
      </div>
      <div class="info-item">
        <strong>备案类型</strong>
        <span>非经营性互联网信息服务备案</span>
      </div>
      <div class="info-item">
        <strong>预计时间</strong>
        <span>5-20 个工作日</span>
      </div>
    </div>

    <div class="contact">
      联系邮箱：<a href="mailto:aiyo407@163.com">aiyo407@163.com</a>
    </div>

    <div class="footer-text">
      本站为个人开发者业余时间维护的技术博客<br>
      非经营性 · 仅供学习交流使用
    </div>
  </div>
</body>
</html>
